version = 1
backends = ["metal"]

[agent]
domain = "llm-serving"
interface = "service"

[accuracy]
command = ["./.vibesys/tasks/flint-m3pro/setup_env.sh", "accuracy"]
timeout_seconds = 1800

[evaluator]
name = "vibesys-evaluator-request-factory"
version = "0.1.0"

[benchmark]
entrypoint = "request-factory-adapter"
args = ["${PROJECT_ROOT}/.vibesys/tasks/flint-m3pro/benchmark/run.py"]
timeout_seconds = 2500
result_protocol = 2

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "Apple Silicon M3 Pro"
count = 1
vendor = "apple"

[catalogue.model]
name = "Recursive Flint int4"
maker = "other"
